name: Generate sitemap

on:
  push:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark generator executable
        run: chmod +x .github/scripts/generate_sitemap.py

      - name: Generate sitemap
        env:
          BASE_URL: ${{ secrets.SITEMAP_BASE_URL }}
        run: .github/scripts/generate_sitemap.py

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo 'sitemap.xml is unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'chore: update sitemap'
          git push
