name = "imageserver-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "blueberry-images"

[[r2_buckets]]
binding = "METADATA"
bucket_name = "blueberry-metadata"

[env.production]
name = "imageserver-worker-prod"
routes = [
  { pattern = "images.yourdomain.com/*", zone_name = "yourdomain.com" }
]
